[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-ai-chat"
version = "0.1.0"
description = "Embeddable AI chat, stdio MCP, skills and host allowlist tools"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = []

[project.scripts]
embedai-chat = "embedai.console:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embedai*"]
